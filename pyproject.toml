[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnai-designer"
version = "0.1.0"
description = "Haplotype-aware RNAi trigger candidate designer"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "RNAi designer contributors"}]

[project.scripts]
rnai-designer = "rnai_designer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
